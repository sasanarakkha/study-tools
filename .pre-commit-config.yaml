exclude: ^(archive|scripts/archive)/

repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff lint
        entry: uv run ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]

      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: true

      - id: pyrefly
        name: pyrefly
        entry: uv run --with pyrefly pyrefly check --min-severity warn
        language: system
        types: [python]
        pass_filenames: true

      - id: patimokkha-regen
        name: regenerate Pātimokkha pages
        entry: bash -c 'bash scripts/pat_preprocessing.sh && git add docs/6-pali-class/bhikkhu-patimokkha/'
        language: system
        files: ^data/patimokkha_word_by_word\.tsv$
        pass_filenames: false
        require_serial: true
