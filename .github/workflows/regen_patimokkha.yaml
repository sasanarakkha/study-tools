name: Regenerate Pātimokkha Pages

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # needed to dispatch deploy_site.yaml after the push

concurrency:
  group: regen-patimokkha
  cancel-in-progress: false   # queue overlapping runs instead of killing a push

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch printer.py from dpd-db
        run: |
          rm -f tools/printer.py
          curl -fsSL "https://raw.githubusercontent.com/sasanarakkha/dpd-db-sbs/main/tools/printer.py" -o tools/printer.py

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - run: uv sync --frozen

      - name: Generate Markdown pages
        run: uv run python scripts/generate_patimokkha.py

      - name: Fix Tables
        run: uv run python scripts/fix_pali_tables.py --dir docs/6-pali-class/bhikkhu-patimokkha

      - name: Test generated pages
        run: uv run pytest tests/test_patimokkha_generation.py -q

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/6-pali-class/bhikkhu-patimokkha/
          if git diff --cached --quiet; then
            echo "No changes — skipping commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "regen: patimokkha pages"
          # printer.py was overwritten above; keep the rebase from tripping over it
          git checkout -- tools/printer.py
          git pull --rebase origin main
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger site deploy and document build
        if: steps.commit.outputs.changed == 'true'
        run: |
          gh workflow run deploy_site.yaml --ref main
          gh workflow run generate_documents.yaml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
