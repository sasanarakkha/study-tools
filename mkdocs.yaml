site_name: SBS DhammaVinaya Learning Tools
site_url: https://sasanarakkha.github.io/study-tools/
docs_dir: docs
site_dir: site
theme:
  name: material
  language: en
  custom_dir: identity
  logo: sbs-mark.svg
  favicon: sbs-favicon-48.png
  font:
    text: false
    code: false
  palette:
    - media: (prefers-color-scheme)
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.indexes
    - content.code.copy
markdown_extensions:
  - attr_list
  - toc:
      permalink: true
  - tables
  - md_in_html
  - nl2br
plugins:
  - search
validation:
  nav:
    omitted_files: ignore
hooks:
  - tools/patimokkha_hook.py
  - tools/home_hook.py
  - tools/dark_image_hook.py
copyright: Sāsanārakkha Buddhist Sanctuary · <a href="https://sasanarakkha.org/">sasanarakkha.org</a>
  · <a href="https://creativecommons.org/licenses/by-nc/4.0/">CC BY-NC 4.0</a>
extra:
  generator: false
  social:
    - icon: fontawesome/solid/house
      link: https://sasanarakkha.org/
      name: Sāsanārakkha Buddhist Sanctuary
    - icon: fontawesome/brands/github
      link: https://github.com/sasanarakkha/study-tools
      name: Source on GitHub
    - icon: fontawesome/solid/envelope
      link: mailto:studytools@sasanarakkha.org
      name: Contact us
extra_css:
  - sbs.css
extra_javascript:
  - sbs.js
nav:
  - Home: index.md
  - 'Foundation in Dhamma-Vinaya: Pre-Pāli Study': 1-pre-pali-study.md
  - SBS Pāḷi-English Recitations: 2-sbs-book.md
  - Pāṭimokkha Book: 3-patimokkha.md
  - Dictionaries:
      - 4-dictionaries/index.md
      - Digital Pāḷi Dictionary with SBS examples: 4-dictionaries/1-sbs-pali-dictionary.md
      - Digital Pāḷi Dictionary with Russian language: 4-dictionaries/2-ru-pali-dictionary.md
      - Digital Pāḷi Dictionary with Tamil language: 4-dictionaries/3-ta-pali-dictionary
          copy.md
  - Anki Decks:
      - 5-anki/index.md
      - SBS Pāḷi-English Vocab: 5-anki/1-sbs/1-sbs-vocab.md
      - Pātimokkha Word By Word: 5-anki/2-patimokkha/1-patimokkha-word-by-word.md
      - Pātimokkha memorization: 5-anki/3-patimokkha-learning.md
      - Bhikkhu Vibhaṅga Pāli: 5-anki/4-vibhanga/1-vibhanga.md
      - DHP Vocab: 5-anki/5-dhp/1-dhp-vocab.md
      - Suttas Advanced Pāli Class: 5-anki/6-suttas/1-sutta-advanced.md
      - SBS Daily Chanting - Anki Deck: 5-anki/7-daily_chants/1-sbs-daily-chanting.md
      - Parittas: 5-anki/8-parittas/1-parittas.md
      - Column for Your Native Language: 5-anki/9-native.md
      - Пали Словарь: 5-anki/10-dps/1-ru-pali-vocab.md
  - Pāli Classes:
      - 6-pali-class/index.md
      - '**Advanced Pāli Education**': 6-pali-class/1-pali-class-adv.md
      - '**Pātimokkha Word By Word class**': 6-pali-class/2-patimokkha-class.md
  - Notebook LM: 7-notebook-lm.md
